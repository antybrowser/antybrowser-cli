app-id: io.antybrowser.Desktop
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: antybrowser-run

tags:
  - privacy
  - networking
  - browser

desktop-file-name: io.antybrowser.Desktop.desktop

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --filesystem=home
  - --filesystem=xdg-download
  - --filesystem=xdg-config/Antybrowser:create

modules:
  - name: antybrowser
    buildsystem: simple
    build-commands:
      - unzip Antybrowser-*-linux-x64.zip
      - cp -rv antybrowser-linux-x64 /app/antybrowser
      - chmod +x /app/antybrowser/antybrowser
      - install -Dm755 antybrowser-run.sh /app/bin/antybrowser-run
      - install -Dm644 io.antybrowser.Desktop.desktop /app/share/applications/io.antybrowser.Desktop.desktop
      - install -Dm644 io.antybrowser.Desktop.metainfo.xml /app/share/metainfo/io.antybrowser.Desktop.metainfo.xml
      - install -Dm644 antybrowser.svg /app/share/icons/hicolor/scalable/apps/io.antybrowser.Desktop.svg
    sources:
      - type: file
        url: https://github.com/antybrowser/antybrowser/releases/download/v2.0.9/Antybrowser-2.0.9-linux-x64.zip
        sha256: PLACEHOLDER_SHA256
      - type: file
        path: antybrowser-run.sh
      - type: file
        path: io.antybrowser.Desktop.desktop
      - type: file
        path: io.antybrowser.Desktop.metainfo.xml
      - type: file
        path: antybrowser.svg
