    InstallerSha256: PLACEHOLDER_SHA256
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: antybrowser.exe
        PortableCommandAlias: antybrowser
  - Architecture: arm64
    InstallerType: zip
    InstallerUrl: https://github.com/antybrowser/antybrowser-cli/releases/download/v1.0.0/antybrowser-windows-arm64.zip
    InstallerSha256: PLACEHOLDER_SHA256
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: antybrowser.exe
        PortableCommandAlias: antybrowser
ManifestType: singleton
ManifestVersion: 1.6.0
