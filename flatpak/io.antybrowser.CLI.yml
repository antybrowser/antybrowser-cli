app-id: io.antybrowser.CLI
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: antybrowser
modules:
  - name: antybrowser
    buildsystem: simple
    build-commands:
      - install -Dm755 antybrowser /app/bin/antybrowser
    sources:
      - type: archive
        url: https://github.com/antybrowser/antybrowser-cli/releases/download/v1.0.0/antybrowser-linux-amd64.tar.gz
        sha256: PLACEHOLDER_SHA256
