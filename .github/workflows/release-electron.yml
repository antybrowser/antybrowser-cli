name: Release Electron App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.1.0)'
        required: true

env:
  NODE_VERSION: '20'
  ELECTRON_VERSION: '39'

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build

      - name: Build NSIS installer
        working-directory: electron
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-x64
          path: electron/dist-temp/*.exe
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build

      - name: Build packages
        working-directory: electron
        run: npx electron-builder --linux deb rpm AppImage --x64 --publish never

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-x64
          path: electron/dist-temp/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-x64
          path: electron/dist-temp/*.rpm
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-x64
          path: electron/dist-temp/*.AppImage
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build

      - name: Build packages
        working-directory: electron
        run: npx electron-builder --linux deb rpm AppImage --arm64 --publish never

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-arm64
          path: electron/dist-temp/*arm64*.deb
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-arm64
          path: electron/dist-temp/*arm64*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-arm64
          path: electron/dist-temp/*arm64*.AppImage
          if-no-files-found: warn

  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    needs: build-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 build
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage-x64
          path: snap-artifacts

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft_args: --destructive-mode

      - name: Upload Snap
        uses: actions/upload-artifact@v4
        with:
          name: linux-snap-x64
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | head -50

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.snap" \) -exec sha256sum {} \; | tee ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Antybrowser v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.snap
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: antybrowser/homebrew-tap
          token: ${{ secrets.TAP_REPO_TOKEN }}

      - name: Get release checksums
        id: checksums
        run: |
          # Get the release artifacts and calculate checksums
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ needs.create-release.outputs.version || github.ref_name }}")
          echo "release_json set"

      - name: Update cask file
        run: |
          VERSION="${{ needs.create-release.outputs.version || github.ref_name }}"
          # The actual update script would go here
          echo "Would update Homebrew cask to version $VERSION"

  update-scoop-bucket:
    name: Update Scoop Bucket
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: antybrowser/scoop-bucket
          token: ${{ secrets.TAP_REPO_TOKEN }}

      - name: Update manifest
        run: |
          VERSION="${{ needs.create-release.outputs.version || github.ref_name }}"
          echo "Would update Scoop manifest to version $VERSION"

  publish-snap-store:
    name: Publish to Snap Store
    needs: build-snap
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download Snap
        uses: actions/download-artifact@v4
        with:
          name: linux-snap-x64

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: ${{ github.workspace }}/*.snap
          release: stable
